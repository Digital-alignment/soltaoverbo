server {
    listen 80;
    listen [::]:80;
    server_name soltaoverbocoletivo.com www.soltaoverbocoletivo.com;

    root /var/www/soltaoverbo;
    index index.html;

    # Logs de acesso e erro
    access_log /var/log/nginx/soltaoverbo.access.log;
    error_log /var/log/nginx/soltaoverbo.error.log;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Fallback para Single Page Application (SPA React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos imutáveis do Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # PWA Service Worker (sem cache para atualizar instantaneamente)
    location /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proteção de arquivos ocultos (.git, .env, etc)
    location ~ /\. {
        deny all;
    }
}
