name: Deploy Frontend para VPS Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Frontend (npm run build)
        run: npm run build

      - name: Sincronizar Arquivos da Pasta dist para VPS via SSH/Rsync
        uses: easingthemes/ssh-deploy@v5.0.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_VPS_IP }}
          REMOTE_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          TARGET: "/var/www/soltaoverbo"
          SOURCE: "dist/"
          ARGS: "-rltgoDzvO --delete"
